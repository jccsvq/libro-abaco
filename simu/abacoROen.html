<!DOCTYPE html>
<html lang="en"><head>
<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
<meta content="utf-8" http-equiv="encoding">
<meta name="robots" content="noindex">
<title>Roman Abacus</title>
<link rel="shortcut icon" href="../images/abacusro.ico" type="image/ico">
<link rel="stylesheet" href="default.css" type="text/css">
<script src="./abacus.js?ver<%=DateTime.Now.Ticks.ToString()%>"></script>
</head>
<body oncontextmenu="return false;">
<h1>Roman Abacus</h1>
<h2>(With column of eighths on the right and modern Roman numerals)</h2>
<div>
  <!--<input id="decrement" type="submit" value="Decrement"/>
  <input id="increment" type="submit" value="Increment"/>-->
  Rods: <input id="abacus_rails" type="number" min="1" value="10"/>
  <!--Rails: <input id="abacus_rails_number" style="padding-left: 2px;" readonly size=1 value="10"><input id="abacus_rails" type="range" min="1" max="24" value="10" oninput="railsChange(this.value)"/>-->
  <input id="teach" type="submit" value="Teach"/>
  <input id="clear" type="submit" value="Clear"/>
  <input id="complement" type="submit" value="Complement"/>
  <input id="undo" type="submit" value="Undo"/>
  <input id="redo" type="submit" value="Redo"/>
</div>
<article id="abacus_article"
  data-format="Roman"
  data-rails="10"
  data-top-pieces="2"
  data-bottom-pieces="6"
  data-subdecks="3"
  data-subbeads="4"
  data-subbase="8"
  data-decimal-position="0"
  data-place-on-rail="1"
  data-roman-numerals="modern"
  data-roman-markers="modern"
  data-subdecks-separated="0"
  data-latin="0"
  data-museum="fr"
  data-right-to-left-add="0"
  data-right-to-left-mult="0"
  data-sound="1"></article>
<div id="abacus_p">
<span id="abacus_span" contenteditable="true" style="padding-right: 16px;"></span></div>
<script>initAbacus(null, document.getElementById("abacus_span"), document.getElementById("abacus_rails"));</script>
<hr>
Note: Eighths can be easily represented on the right side by combining the bottom three beads as eighths and the top bead as a half.<br>
<iframe src="./tail-frame-EN.html" title="Page footer" width="100%" height="85" style="border:none"></iframe><br>


</body>
</html>
